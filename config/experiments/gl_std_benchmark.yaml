schema_version: 1

meta:
  name:   std_benchmark
  status: adopted
  role:   benchmark
  backs: >
    THE Greenland fidelity benchmark, merging the former gl_full_pbed_rssnr
    (geikie) and wc_full_pbed (westcoast) into one protocol that runs
    identically on either line. Its purpose is the "did a simulator change
    help or hurt" loop: re-run per line, compare the recorded metrics.
  runtime: >
    per line, cold cache: geikie ~2 h + the constant-gamma arm; westcoast
    ~2.2 h + arm. A moved solved-A re-simulates (different physics); a
    converged one replays from cache.
  note: >
    NO NUMBERS in this spec. The bed comes from the reference pass's picks,
    the reflectivity structure from the pinned RSSNR store, and the two
    physical calibration parameters -- gamma_surface (manual, with
    provenance) and A (manual or the RSSNR-vs-2H regression) -- from each
    LINE's calibration block. The old K/D anchoring machinery is gone: the
    mapping is |Gamma|^2 = 2AH - RSSNR + (gamma_surface - T^2), and the
    post-run bed-level residuals are recorded as chain diagnostics rather
    than absorbed.
    Run:  uv run python tools/run_basal_clutter.py \
            --config config/experiments/gl_std_benchmark.yaml --line <name>
    Passes default to the line's real ones (synthetics are design studies,
    not benchmark members); the single-trace decomposition location defaults
    to the line's own.

run:
  lines:
  - greenland_geikie01_transit
  - greenland_westcoast
  segment: full

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true

  physics:
    att_db_per_km:     solve
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  true

  out_name: std_benchmark
