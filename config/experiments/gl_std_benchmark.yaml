schema_version: 1

meta:
  name:   std_benchmark
  status: adopted
  role:   benchmark
  backs: >
    THE Greenland fidelity benchmark, merging the former gl_full_pbed_rssnr
    (geikie) and wc_full_pbed (westcoast) into one protocol that runs
    identically on either line. Its purpose is the "did a simulator change
    help or hurt" loop: re-run per line, compare the recorded metrics.
  runtime: >
    per line, cold cache: geikie ~2 h + the constant-gamma arm; westcoast
    ~2.2 h + arm. A moved solved-A re-simulates (different physics); a
    converged one replays from cache.
  note: >
    NO NUMBERS in this spec. The bed comes from the reference pass's picks,
    the reflectivity structure from the pinned RSSNR store, and the two
    physical calibration parameters -- gamma_surface (manual, with
    provenance) and A (manual or the RSSNR-vs-2H regression) -- from each
    LINE's calibration block. The old K/D anchoring machinery is gone: the
    mapping is |Gamma|^2 = 2AH - RSSNR + (gamma_surface - T^2), and the
    post-run bed-level residuals are recorded as chain diagnostics rather
    than absorbed.
    Run:  uv run python tools/run_basal_clutter.py \
            --config config/experiments/gl_std_benchmark.yaml --line <name>
    Passes default to the line's real ones plus the experiment's declared
    extra passes (the line's own synthetics stay opt-in); the single-trace
    decomposition location defaults to the line's own.

run:
  lines:
  - greenland_geikie01_transit
  - greenland_westcoast
  segment: full

  bed:
    source: picked

  extra_passes:
    # The cross-line design points (user decision 2026-08-20): the SAME
    # stated instrument -- haps_60mhz, 60/15 MHz stratospheric box -- flown
    # at 14 and 20 km over every study line, riding each line's reference
    # pass geometry. Instrument-identical across lines by construction.
    haps_14km:
      carrier:    reference
      altitude_m: 14000.0
      instrument: haps_60mhz
    haps_20km:
      carrier:    reference
      altitude_m: 20000.0
      instrument: haps_60mhz

  # Bed scattering physics (adopted 2026-08-21, getz pilot evidence --
  # docs/bed_scattering.md): tilt-gated specular/diffuse split (T5) fixes
  # the post-bed falloff; Gerekos sub-facet bed roughness at sigma = 0.10 m
  # (l = lambda_ice) draws a continuous bed horizon instead of specular
  # glint spots, with the bed-arm mean profile landing on the measured
  # curve. sigma = 0.22 (T1) floods below-bed and stays rejected.
  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0

  physics:
    att_db_per_km:     solve
    surface_roughness: true
    bed_roughness:
      sigma_m: 0.10
      corr_length_m: 0.886

  processing:
    chain:      standard
    proc_cache: true
    companion:  true

  out_name: std_benchmark
