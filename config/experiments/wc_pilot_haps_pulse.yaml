schema_version: 1

meta:
  name:   wc_pilot_haps_pulse
  status: exploratory
  role:   study
  backs: >
    Pulse-length sensitivity of the 14 km HAPS design point on the westcoast
    pilot window: haps_60mhz (20 us) vs haps_60mhz_5us (5 us), same physics
    as pilot_smoke, real passes kept for context.

run:
  line: greenland_westcoast
  segment: pilot

  bed:
    source: picked

  extra_passes:
    haps_14km:
      carrier:    reference
      altitude_m: 14000.0
      instrument: haps_60mhz
    haps_14km_5us:
      carrier:    reference
      altitude_m: 14000.0
      instrument: haps_60mhz_5us

  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0

  physics:
    att_db_per_km:     solve
    surface_roughness: true
    bed_roughness:
      sigma_m: 0.10
      corr_length_m: 0.886

  processing:
    chain:      standard
    proc_cache: true
    companion:  false

  out_name: wc_pilot_haps_pulse
