schema_version: 1

meta:
  name:     gl_haps60_at_14km
  status:   exploratory
  role:     study
  requires: [gl_full_pbed_proc_att14_rssnr]
  backs:    >
    Instrument-swap demonstrator: the adopted Greenland configuration with the
    real MCoRDS pair replaced, at a synthetic 14 km altitude, by the
    stratospheric 60 MHz design point. Answers "would a cheaper, lower-carrier
    box on a HAPS still see this bed?" against a line whose real-instrument
    fidelity is already characterised.
  runtime:  not yet run
  note: >
    Shows both swap axes at once. `low` and `high` keep their real geometry
    AND their real radar, so they remain the fidelity reference; `haps14km` is
    an observation this experiment invents -- the low pass's line and picks
    re-flown at 14 km with a different instrument. Nothing about the line
    definition changes, which is what makes the comparison single-variable.

run:
  line:     greenland_2014_2017
  segment:  full
  out_name: gl_haps60_at_14km
  passes:   [low, high, haps14km]

  extra_passes:
    haps14km:
      carrier:    low            # its line geometry, picks and nav
      altitude_m: 14000.0
      instrument: haps_60mhz
      facet_spacing_scale: 0.7   # same Fresnel-zone LPA guard as syn14km
      why: >
        The syn14km entry on this line needs 0.7x to clear the Fresnel-zone
        LPA check at 14 km; the same geometry applies here. Re-gate with a
        2-trace pilot before trusting the full run, since the 60 MHz carrier
        changes the facet-size limit.

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true
    anchor:           level
    level_deficit_db:
      value: -7.89
      from:  full_pbed_proc_att14
      how: >
        Reused from the adopted A = 14 configuration so the swap is the ONLY
        variable. Strictly this D was solved against the MCoRDS instrument;
        re-deriving it for a 60 MHz box is the honest follow-up and the
        residual reported here should be read with that caveat.

  physics:
    att_db_per_km:     14.0
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  full_pbed_proc_att14

  figures:
    trace_decomp_s_km: [30.0]
