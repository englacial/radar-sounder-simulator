schema_version: 1

meta:
  name:     full_pbed_proc_att14_rssnr
  status:   adopted
  requires: [gl_full_pbed_proc_att14]
  backs:    greenland_pair_findings.md 3.6; handoff "Greenland current runs"
  runtime:  ~66 min sim (low 1875 s / high 1274 s / syn14km 826 s)
  note: >
    The active Greenland configuration. Had NO recorded command before this
    file (foundations review A1) -- it was described only as "everything
    else identical to the A = 14.0 constant-gamma run", and the companion
    directory name appeared nowhere.
    PENDING: the MacGregor arbitration favours A = 16 +/- 2; adopting it
    means re-deriving D against a new A=16 constant-gamma run, so this spec
    stays at 14.0 until that decision is taken.

run:
  line:     greenland_2014_2017
  segment:  full
  out_name: full_pbed_proc_att14_rssnr
  passes:   [low, high, syn14km]

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true
    anchor:           level
    level_deficit_db:
      value: -7.89
      from:  full_pbed_proc_att14
      how: >
        CONTAMINATION-AWARE: D = median(measured bed window) -
        median(simulated BED-RETURNS bed window) on the LOW pass ONLY
        (-107.76 - (-99.87) = -7.89 dB). The decomposition is used rather
        than the total field because the total also holds A-independent
        surface clutter; the HIGH pass is excluded because its bed window is
        surface-dominated (bed returns 4.1 dB BELOW surface returns), so its
        total level moves only 0.19 dB per dB/km. The HIGH pass residual is
        the TRANSFER TEST.
        NOTE: stated here rather than inherited from the line registry
        (LEVEL_ANCHOR_DEFICIT_DB), per the decision that a spec states the
        numbers that define its result. Same value, so K is unchanged; the
        recorded level_anchor.source reads "supplied" instead of "registry
        default".

  physics:
    att_db_per_km:     14.0
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  full_pbed_proc_att14

  figures:
    trace_decomp_s_km: [30.0]
