schema_version: 1
meta:
  name: wc_hd_b1fix
  status: exploratory
  role: study
  backs: HAPS 14 km frequency ladder (8 el Hann on 10 m, T 8 us, chirp) with the fixture surface roughness -- the control for wc_hd_b1
run:
  line: greenland_westcoast
  segment: pilot
  passes:
  - p3_2017
  - hd_f60_n8_hann
  - hd_f150_n8_hann
  - hd_f225_n8_hann
  - hd_f300_n8_hann
  bed:
    source: picked
  extra_passes:
    hd_f60_n8_hann:
      carrier: reference
      altitude_m: 14000.0
      instrument: hd_f60_n8_hann
      facet_spacing_scale: 0.7
    hd_f150_n8_hann:
      carrier: reference
      altitude_m: 14000.0
      instrument: hd_f150_n8_hann
      facet_spacing_scale: 0.7
    hd_f225_n8_hann:
      carrier: reference
      altitude_m: 14000.0
      instrument: hd_f225_n8_hann
      facet_spacing_scale: 0.7
    hd_f300_n8_hann:
      carrier: reference
      altitude_m: 14000.0
      instrument: hd_f300_n8_hann
      facet_spacing_scale: 0.7
  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0
  physics:
    att_db_per_km: solve
    surface_roughness: true
    bed_roughness:
      sigma_m: 0.1
      corr_length_m: 0.886
  processing:
    chain: standard
    proc_cache: true
    companion: false
    posting_div: 1
  out_name: wc_hd_b1fix
