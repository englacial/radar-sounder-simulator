schema_version: 1

meta:
  name:     full_line
  status:   adopted
  requires: [ant_att20_klevel]
  backs:    basal_clutter_pilot_findings.md "FULL_LINE" (2026-08-10)
  runtime:  ~65 min sim for all five passes (high ~13, low ~28)
  note: >
    The whole 148.45 km overlapping line, grounding line included. HYBRID
    bed: grounded side is the DEMOGORGN realization exactly as in
    ant_extended, floating side is the LOW pass's radar basal picks (the
    ice-ocean shelf base), linearly blended over GL -> GL+4 km.
    CAVEAT (foundations review A3): run() overwrites metrics.json per
    invocation, so a staged per-pass build leaves a canonical file holding
    only the LAST pass. Run this spec in ONE process until the metrics
    merge lands; if you must stage, keep metrics_<pass>.json copies.

run:
  line:     antarctic_2016
  segment:  full_line
  out_name: full_line
  passes:   [low, mid, high, syn14km, syn300km]

  bed:
    source:         hybrid
    demogorgn_seed: 0

  reflectivity:
    gamma_from_rssnr: true
    anchor:           level
    level_deficit_db:
      value: 3.56
      from:  att20
      how: >
        Reused verbatim from the 50 km mapping; K = +7.92 dB is NEVER
        re-derived on the longer line (K_ANCHOR_SEGMENT pins it to 'full').

  physics:
    att_db_per_km:     20.0
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  false

  figures:
    trace_decomp_s_km: [31.0, 120.0]   # grounded trough + mid-shelf floating
    per_pass:          true
    plot_s_max_km:     100.0
    width_scale:       2.0
