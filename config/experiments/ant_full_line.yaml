schema_version: 1

meta:
  name:    full_line
  status:  adopted
  role:    benchmark
  backs: >
    basal_clutter_pilot_findings.md "FULL_LINE" (2026-08-10) and the handoff's
    Antarctic headline. THE experiment for this line: the whole 148.45 km
    overlapping line at the configuration att20_klevel established on the
    50 km segment (A = 20 dB/km, level-anchored K = +7.92 dB). The two
    narrower runs it grew out of -- att20_klevel (18-68 km, where K was
    calibrated) and extended (0-69.7 km) -- were retired when the
    experiments were consolidated to one per line; they are in git history
    if the intermediate extents are ever needed again.
  runtime: 82 min for all five passes on a cold cache (2026-08-25 kernels; 321 min before)
  note: >
    HYBRID bed: the grounded side (s < 69.7 km) is the DEMOGORGN realization,
    the floating side is the LOW pass's radar basal picks -- the ice-ocean
    shelf base -- linearly blended over a 4 km ramp past the grounding line.
    BedMachine/DEMOGORGN report the SEAFLOOR beyond the GL, not the reflector
    the radar sees, and are never used there.
    CALIBRATION (2026-08-20): the old K/D anchoring is replaced by the
    line's calibration block -- gamma_surface pinned at the physical -10 dB
    (the in-run solve gave an unphysical +4.3; recorded as a diagnostic)
    and A solved by the RSSNR-vs-2H regression (18.61 dB/km). The former
    att20_klevel LEVEL match is deliberately no longer reproduced: the
    chain anomaly lives in the recorded residuals. The DC-8 syn_14km /
    syn_20km design passes were replaced by the cross-line haps extras
    (user decision 2026-08-20); they remain defined on the line.

run:
  line:     antarctica_getz
  segment:  full_line
  out_name: full_line
  passes:   [real_low, real_9km, real_10km, haps_14km, haps_20km]

  extra_passes:
    # The cross-line design points (user decision 2026-08-20): the SAME
    # stated instrument -- haps_60mhz, 60/15 MHz stratospheric box -- flown
    # at 14 and 20 km over every study line, riding each line's reference
    # pass geometry. Instrument-identical across lines by construction.
    haps_14km:
      carrier:    reference
      altitude_m: 14000.0
      instrument: haps_60mhz
    haps_20km:
      carrier:    reference
      altitude_m: 20000.0
      instrument: haps_60mhz


  bed:
    source:         hybrid          # implies segment full_line, and vice versa
    demogorgn_seed: 0

  # Bed scattering physics (adopted 2026-08-21, getz pilot evidence --
  # docs/bed_scattering.md): tilt-gated specular/diffuse split (T5) fixes
  # the post-bed falloff; Gerekos sub-facet bed roughness at sigma = 0.10 m
  # (l = lambda_ice) draws a continuous bed horizon instead of specular
  # glint spots, with the bed-arm mean profile landing on the measured
  # curve. sigma = 0.22 (T1) floods below-bed and stays rejected.
  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0
  physics:
    att_db_per_km:     solve   # -> the line's calibration (manual A=20)
    surface_roughness: true
    bed_roughness:
      sigma_m: 0.10
      corr_length_m: 0.886

  processing:
    chain:      standard
    proc_cache: true
    companion:  false     # no RSSNR acceptance analysis on this run

  figures:
    trace_decomp_s_km: [31.0, 120.0]   # grounded trough + mid-shelf floating
    per_pass:          true
    plot_s_max_km:     100.0
    width_scale:       2.0
