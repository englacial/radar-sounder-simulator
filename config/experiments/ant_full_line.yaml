schema_version: 1

meta:
  name:    full_line
  status:  adopted
  role:    benchmark
  backs: >
    basal_clutter_pilot_findings.md "FULL_LINE" (2026-08-10) and the handoff's
    Antarctic headline. THE experiment for this line: the whole 148.45 km
    overlapping line at the configuration att20_klevel established on the
    50 km segment (A = 20 dB/km, level-anchored K = +7.92 dB). The two
    narrower runs it grew out of -- att20_klevel (18-68 km, where K was
    calibrated) and extended (0-69.7 km) -- were retired when the
    experiments were consolidated to one per line; they are in git history
    if the intermediate extents are ever needed again.
  runtime: ~65 min sim for all five passes on a cold cache
  note: >
    HYBRID bed: the grounded side (s < 69.7 km) is the DEMOGORGN realization,
    the floating side is the LOW pass's radar basal picks -- the ice-ocean
    shelf base -- linearly blended over a 4 km ramp past the grounding line.
    BedMachine/DEMOGORGN report the SEAFLOOR beyond the GL, not the reflector
    the radar sees, and are never used there.
    CALIBRATION (2026-08-20): the old K/D anchoring is replaced by the
    line's calibration block -- gamma_surface = +7.21 dB (effective; carries
    the un-audited +18 dB surface anomaly) and A = 20 manual. The mapping
    constant equals the adopted K = +7.92 exactly, and being anchoring-free
    it is segment-independent, which retires the K_ANCHOR_SEGMENT pin.

run:
  line:     antarctica_getz
  segment:  full_line
  out_name: full_line
  passes:   [real_low, real_9km, real_10km, syn_14km, syn_20km]

  bed:
    source:         hybrid          # implies segment full_line, and vice versa
    demogorgn_seed: 0

  reflectivity:
    gamma_from_rssnr: true
  physics:
    att_db_per_km:     solve   # -> the line's calibration (manual A=20)
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  false     # no RSSNR acceptance analysis on this run

  figures:
    trace_decomp_s_km: [31.0, 120.0]   # grounded trough + mid-shelf floating
    per_pass:          true
    plot_s_max_km:     100.0
    width_scale:       2.0
