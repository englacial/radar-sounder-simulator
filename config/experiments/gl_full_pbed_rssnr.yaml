schema_version: 1

meta:
  name:    full_pbed_rssnr
  status:  adopted
  role:    benchmark
  backs: >
    greenland_pair_findings.md 3.6 and the handoff's "Greenland current runs".
    THE experiment for this line. Its constant-gamma A = 14 predecessor
    (full_pbed_proc_att14) is no longer a separate experiment: the
    constant-gamma arm the acceptance analysis scores against now runs inside
    this one, in its own cache directory.
  runtime: ~66 min sim on a cold cache, plus the constant-gamma arm
  note: >
    Best instrument parity of any multi-altitude repeat found: the two real
    passes share fc/B/waveforms/PRF exactly (mcords3_p3_greenland reads both
    from their own OPR frames). Established result on this line is that
    surface+bed geometry CANNOT explain the measured column -- it is
    englacial-scattering dominated -- so the bed-referenced metrics here are
    the ones to read, not the mid-column trend.
    PENDING: the MacGregor arbitration favours A = 16 +/- 2 full-column.
    Adopting it means re-deriving D against a new A = 16 constant-gamma arm,
    so this stays at 14.0 until that decision is taken.

run:
  line:     greenland_geikie01_transit
  segment:  full
  out_name: full_pbed_rssnr
  passes:   [low, high, syn14km]

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true
    anchor:           level
    level_deficit_db:
      value: -11.56
      how: >
        Solved under the study-wide level_anchor rule (config/analysis.yaml):
        contamination-aware, bed*10^(D/10) + surface = measured, median over
        the passes whose bed returns stand >= 10 dB clear of their surface
        returns. Only the LOW pass qualifies (margin +10.3 dB); the HIGH pass
        is excluded automatically (bed returns 4.1 dB BELOW surface returns,
        so its level moves ~0.19 dB per dB/km and would drag D toward the
        clutter floor). Its post-run residual remains the TRANSFER TEST.
        CHANGED 2026-08-18, and this MOVES the bed level by 3.67 dB: the
        previous -7.89 was a plain measured-minus-bed-returns difference,
        which credits the bed with power the surface actually supplied. That
        choice was invisible on the Antarctic line (surface 19-37 dB below
        the bed, the two forms agree to 0.02 dB) but not here, where the bed
        stands only 10.3 dB clear. The line's own derivation note argued for
        contamination-awareness and then did not apply it.
        Source: the constant-gamma A = 14 arm of this configuration.

  physics:
    att_db_per_km:     14.0
    surface_roughness: true

  processing:
    chain:      standard
    proc_cache: true
    companion:  true      # constant-gamma arm, in-run, for the acceptance r

  figures:
    trace_decomp_s_km: [30.0]
