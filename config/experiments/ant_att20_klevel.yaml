schema_version: 1

meta:
  name:    att20_klevel
  status:  adopted
  backs:   >
    basal_clutter_pilot_findings.md (attenuation family analysis);
    handoff "Antarctic best config" -- A=20 + level anchoring is the only
    family member that is physical, level-matching AND shape-matching.
  runtime: ~39 min sim + ~6 min processing (9900X, 5 passes)
  note: >
    HISTORICAL: this directory was built by TWO invocations -- claude_notes/
    klevel_sweep.sh (which requests only syn30km) and an undocumented
    follow-up adding syn500km, which cache-hit the first four passes. This
    spec reproduces the FINAL state in one run; following klevel_sweep.sh
    alone yields a directory missing syn500km.

run:
  line:     antarctic_2016
  segment:  full
  out_name: att20_klevel
  out_root: outputs/basal_clutter/hypothesis_tests
  passes:   [low, mid, high, syn30km, syn500km]

  bed:
    source:         demogorgn
    demogorgn_seed: 0

  reflectivity:
    gamma_from_rssnr: true
    anchor:           level
    level_deficit_db:
      value: 3.56
      from:  att20
      how: >
        CONTAMINATION-AWARE, not the module default 14.8 (which is the stale
        median-to-median value at att 31). Per pass D_clean solves
        bed*10^(D/10) + surface = measured on the recorded bed-window
        decomposition; median over the three real passes.
        att20 -> -1.28 / +4.11 / +3.56, median +3.56.

  physics:
    att_db_per_km:     20.0
    surface_roughness: true

  processing:
    chain:     standard
    companion: false        # acceptance analysis not part of this run

  figures:
    # the scout's deep trough at s = 31 km -- the highest per-km bed relief
    # on the grounded line, i.e. structured resolvable off-nadir bed clutter.
    # Equals the line default for this segment; stated so the spec describes
    # what its figures show rather than inheriting it silently.
    trace_decomp_s_km: [31.0]
