schema_version: 1

meta:
  name:   pilot_smoke_exp
  status: exploratory
  role:   study
  backs: >
    pilot_smoke with the surface interface's sub-facet roughness taken
    DIRECTLY from the measured OIB ATM exponential-ACF fit
    (config/roughness/atm_b1.yaml, source atm_exponential) and run through
    the kernel's acf: exponential option (docs/roughness.md,
    claude_notes/roughness_exponential_2026-08-27.md) -- no effective
    Gaussian, no clutter-angle choice. geikie: the line's best family
    (sigma 5.15 cm, l 5.28 m); westcoast: an exponential fit to a
    self-affine (power-law) surface, to show how far it gets. Everything
    else identical to pilot_smoke / pilot_smoke_b1.

run:
  lines:
  - greenland_geikie01_transit
  - greenland_westcoast
  segment: pilot

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0

  physics:
    att_db_per_km:     solve
    surface_roughness:
      source: atm_exponential
    bed_roughness:
      sigma_m: 0.10
      corr_length_m: 0.886

  processing:
    chain:      standard
    proc_cache: true
    companion:  false

  out_name: pilot_smoke_exp
