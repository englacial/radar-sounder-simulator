schema_version: 1

meta:
  name:   pilot_smoke_b1_th20
  status: exploratory
  role:   study
  backs: >
    pilot_smoke with the path-B1 surface roughness
    (claude_notes/roughness_b1_2026-08-26.md): the surface interface's
    Gaussian pair is resolved per pass from the measured OIB ATM surface PSD
    (config/roughness/atm_b1.yaml), tangent at the Bragg wavenumber of the
    30 deg clutter angle, instead of the C&S firn-layer fixture. Everything
    else identical to pilot_smoke (adopted physics, calibration, processing).

run:
  lines:
  - antarctica_getz
  - greenland_geikie01_transit
  - greenland_westcoast
  segment: pilot

  bed:
    source: picked

  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse:
      specular_fraction: 0.5
      tilt_s0_deg: 3.0

  physics:
    att_db_per_km:     solve
    surface_roughness:
      source: atm_b1
      theta_c_deg: 20.0
    bed_roughness:
      sigma_m: 0.10
      corr_length_m: 0.886

  processing:
    chain:      standard
    proc_cache: true
    companion:  false

  out_name: pilot_smoke_b1_th20
