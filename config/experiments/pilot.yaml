schema_version: 1
meta:
  name: pilot
  description: >
    Every study line over its 10 km pilot window (the cheap end of the fidelity loop, otherwise identical to full): the real passes as flown
    plus the cross-line HAPS design points (the six-element 60 MHz
    half-wavelength and one-wavelength arrays at 14 km riding the reference
    pass). Run: tools/run_basal_clutter.py --config
    config/experiments/pilot.yaml --line <line>.

run:
  lines: [antarctica_david, antarctica_getz, antarctica_pineisland_north,
          antarctica_pineisland_south, greenland_geikie01_transit,
          greenland_westcoast]
  segment: pilot

  extra_passes:
    haps_14km_halflambda: {carrier: reference, altitude_m: 14000.0,
                           instrument: haps_60mhz_6el_halflambda}
    haps_14km_lambda: {carrier: reference, altitude_m: 14000.0,
                       instrument: haps_60mhz_6el_lambda}

  bed:                         # DEM comes from the line (identity.bed_dem)
    nadir: picked
    floating: picked
    demogorgn_seed: 0

  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse: {specular_fraction: 0.5, tilt_s0_deg: 3.0}

  physics:
    att_db_per_km: solve       # -> the line's calibration block
    # ATM-derived exponential-ACF surface (config/roughness/atm_b1.yaml +
    # atm_tier2_strata.yaml; one entry per line, reference-pass spectrum;
    # adopted 2026-08-28, pilot median mid-column error 58 -> 10 dB). The
    # former fixture was `true` (C&S firn-layer sigma 4.9 cm, l 2.98 m, Gaussian).
    surface_roughness: {source: atm_exponential}
    bed_roughness: {sigma_m: 0.10, corr_length_m: 0.886}

  processing:
    chain: standard
    proc_cache: true
    # posting_div 8 refines slow time to ~1.9 m at 60 MHz so wide-angle
    # along-track surface returns are not Doppler-aliased into the HAPS
    # images (2026-09-03: at posting_div 1 they buried the bed by ~18 dB);
    # product_resolution keeps the product-posting aperture.
    posting_div: 8
    focus_aperture: product_resolution
    companion: false
