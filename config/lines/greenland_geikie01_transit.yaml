schema_version: 1
name: greenland_geikie01_transit
# Altitude line: one MCoRDS3 P-3 system flown at 0.5 km (2014) and 2.5 km
# (2017) AGL over the same 139 km central-west interior transit. The full
# segment contains a turn (s 40-80 km) the two aircraft flew on different
# radii, up to 1.3 km apart; the decomposition traces sit in the aligned
# stretches.

identity:
  case_prefix: greenland_geikie
  crs: EPSG:3413
  fc_hz: 195000000.0
  grounding_line_s_km: null
  bed_dem: bedmachine

reference:
  pass: p3_2014_low
  frames: ['20140421_01_069', '20140421_01_070', '20140421_01_071']

order: [p3_2014_low, p3_2017_high]

passes:
  p3_2014_low:
    agl_med_m: 465.0
    season: 2014_Greenland_P3
    param_frame: '20140421_01_069'
    instrument: mcords3_p3_2014
    reversed: false
    segments:
      pilot:
      - {frame: '20140421_01_069', slice: [1672, 2341]}
      full:
      - {frame: '20140421_01_069', slice: [700, 3332]}
      - {frame: '20140421_01_070'}
      - {frame: '20140421_01_071'}
  p3_2017_high:
    agl_med_m: 2483.0
    season: 2017_Greenland_P3
    param_frame: '20170424_01_067'
    instrument: mcords3_p3_2014
    reversed: false
    segments:
      pilot:
      - {frame: '20170424_01_067', slice: [973, 1641]}
      full:
      - {frame: '20170424_01_067'}
      - {frame: '20170424_01_068'}
      - {frame: '20170424_01_069', slice: [0, 2586]}

segments:
  pilot:                       # 10 km window, s 25-35 km
    s0_km: 25.0
    n_traces: 48
    decomp_s_km: [30.0]
  full:                        # s 10.5-149.7 km, all three frames of each pass
    s0_km: 10.5
    n_traces: 672
    decomp_s_km: [30.0, 135.0]

figures:
  radargram: {y_us: [-1.0, 34.0], db: [-120.0, 5.0], scale: shared, source_color: false}
  profile: {rel_us: [-1.5, 34.5], x_us: [-1.0, 34.0], db: [-140.0, 5.0]}

rssnr:
  snapshot: GEAMAHQ7BRVPG9SQPK20
  store: {bucket: opr-radar-metrics, prefix: icechunk/greenland, region: us-west-2}

provenance:
  measured_caveats: >
    CSARP_standard. Same fc/B/waveforms/PRF on both passes; product fast-time
    bin differs 0.16% (33.386 vs 33.333 ns) and t0 by 167 ns, so compare in
    metres/microseconds, never bin index. img_comb blend lengths differ, so
    the first ~3 us below the surface is not one instrument across passes.
    The high pass records ~7.9 us of post-bed tail (low: ~21 us). BedMachine
    Greenland v5 reproduces 23-46% of the radar-pick along-track bed roughness.
  real_chain:
    product: CSARP_standard
    sar: motion-compensated f-k migration (2014/2017 param_csarp/param_sar)
    combine: delay-and-sum; CReSIS-standard look/decimation convention (assumed)
    window: hanning (verified)

calibration:
  gamma_surface_db:
    value: -10.0
    why: >
      Physical air-ice value (~1 dB above smooth Fresnel -11.03). The in-run
      solve gave -2.04 dB with 21.8 dB pass disagreement; kept as a
      diagnostic (claude_notes/gamma_solve_design_2026-08-20.md).
  att_db_per_km:
    value: 16.0
    why: >
      MacGregor arbitration, 16 +/- 2 dB/km full column
      (claude_notes/macgregor_attenuation_scout.md). The RSSNR-vs-2H
      regression is rejected here: a thawed-bed Gamma-H confounder gives
      A ~ 0.7, r = 0.11.
