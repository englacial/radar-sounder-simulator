    facet_spacing_scale: 0.7
    why: |-
      2-trace geometry/phase gate (2026-08-11), the syn500km/syn300km failure class: the beta = 0.5 spacing (54.97 m) builds 79.2 m facets on the anisotropic +-12.05 km window and trips the Fresnel-zone LPA check (limit 54.4 m, ratio 1.46). 0.7x snaps the DEM stride down one notch, clears the check with no warnings, and leaves the field finite with nadir surface/bed delays matching the picks to <= 15 ns.
