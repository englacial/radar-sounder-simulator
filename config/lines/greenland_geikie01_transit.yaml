provenance:
  measured_caveats: |-
    Measured references are CSARP_standard. Scout quirks recorded: the two passes share fc/B/waveforms/PRF/SAR params exactly, but the product fast-time bin differs 0.16% (33.3859 vs 33.3333 ns) and t0 by 167 ns (5 bins), so every depth/delay comparison is made in METRES or MICROSECONDS on each pass's OWN lattice and never by bin index; img_comb blend lengths differ (low [3 us, -inf, 2.64 us; 10 us, -inf, 3.5 us] vs high [3, -inf, 1; 10, -inf, 3]) so the first ~3 us below the surface is NOT one instrument across passes; the ft_wind decode falls back on both passes and the scout hand-verified the true value IS hanning; param_csarp.combine.method reads 'mvdr' on the 2017 frames while param_combine reads 'standard' (param_combine is the one that describes CSARP_standard). The 2017 surface pick sits ~25 m (5 range bins) below the 2014 one against ArcticDEM while the picked ice thicknesses agree to 7 m -- a common-mode twtt/elevation reference offset, removed per frame by the surface registration gate, never shared between passes. BedMachine Greenland v5 (150 m) reproduces only 23-46% of the radar-pick along-track bed roughness rms, so simulated basal clutter is expected systematically smoother in fine texture than measured (the --picked-bed residual corrects the NADIR bed onto the low pass's picks). The high pass records only ~7.9 us of post-bed tail (vs ~21.1 us for the low pass): bed-tail metrics beyond +3 us are coverage-limited at altitude and tail_coverage records it.
  real_chain:
    product: CSARP_standard
    sar: |-
      motion-compensated f-k migration (2014/2017 P-3 param_csarp/param_sar; the pair shares fc/B/waveforms/PRF/SAR params exactly per the scout table)
    combine: |-
      delay-and-sum channels; the CReSIS-standard look/decimation convention is ASSUMED here -- not read from the 2014/2017 structs. param_csarp.combine.method reads 'mvdr' on the 2017 frames while param_combine reads 'standard' (param_combine is the one describing CSARP_standard)
    window: |-
      ft_wind hanning (decode falls back on both passes; scout hand-verified the true value IS hanning)
    caveat: |-
      product fast-time bin differs 0.16% between the passes (33.3859 vs 33.3333 ns) and t0 by 167 ns, so every depth/delay comparison is made in metres or microseconds on each pass's OWN lattice

calibration:
  gamma_surface_db:
    value: -10.0
    why: >
      user decision 2026-08-20: the in-run solve gave -2.04 (21.8 dB pass disagreement) dB, which is not
      a physically plausible surface reflectivity (it absorbs chain/model
      anomalies into the calibration). Pin the physical ~-10 dB (~1 dB
      above smooth air->ice Fresnel -11.03) and read the anomaly where it
      belongs: in the recorded bed-level residuals and the gamma_solve
      diagnostic of every run. claude_notes/gamma_solve_design_2026-08-20.md
      has the per-pass numbers.
  att_db_per_km:
    value: 16.0
    why: >
      MacGregor arbitration, adopted by user decision 2026-08-20: three
      routes converge on 16 +/- 2 dB/km full-column (see
      claude_notes/macgregor_attenuation_scout.md). Slope regression is
      REJECTED on this line (thawed-bed Gamma-H confounder gives A~0.7,
      r=0.11 -- the gamma_bed-thickness independence assumption fails).
