synthetic_passes:
  syn14km:
    altitude_m: 14000.0
    carrier: low
    facet_spacing_scale: 0.7
    why: |-
      2-trace geometry/phase gate (2026-08-11), the syn500km/syn300km failure class: the beta = 0.5 spacing (54.97 m) builds 79.2 m facets on the anisotropic +-12.05 km window and trips the Fresnel-zone LPA check (limit 54.4 m, ratio 1.46). 0.7x snaps the DEM stride down one notch, clears the check with no warnings, and leaves the field finite with nadir surface/bed delays matching the picks to <= 15 ns.
  syn20km:
    altitude_m: 20000.0
    carrier: low
    facet_spacing_scale: 0.7
segments:
  pilot:
    s0_km: 25.0
    n_traces: 48
    decomp_s_km:
    - 30.0
  full:
    s0_km: 11.0
    n_traces: 140
    decomp_s_km:
    - 30.0
  # TRANSIT segment (2026-08-18): ONE continuous path through all three
  # frames of each pass, s 10.46 -> 149.69 km on the anchor axis.
  #
  # It deliberately CONTAINS a misalignment. The two flights run 5-45 m apart
  # over s 10-40, up to 1299 m apart over s 40-80, and 14-63 m apart over
  # s 120-150. That middle excursion is a TURN, not a different route: the
  # reference track swings from heading -156 to -114 deg between s 40 and
  # s 60 (measured, 1.7-2.9 deg/km), and the two aircraft flew the turn on
  # different radii. Accepted rather than excised, so the line is one path;
  # any metric taken across it must read the offset profile first, and the
  # decomposition locations below sit in the two well-aligned stretches.
  transit:
    s0_km: 10.5
    n_traces: 672
    decomp_s_km:
    - 30.0
    - 135.0
