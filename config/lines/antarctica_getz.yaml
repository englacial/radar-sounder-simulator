provenance:
  measured_caveats: |-
    Measured references are CSARP_standard. Scout pitfalls recorded: the low pass composites 1/3/10 us waveforms vs 3/10 us on the high passes (do not compare the first ~3 us below the surface across passes as one instrument); PRF differs (12000 vs 7500 Hz) though the posting does not; BedMachine's 500 m bed reproduces only ~55% of the radar-pick along-track bed roughness rms, so simulated basal clutter is expected systematically smoother and weaker in fine texture than measured.
  real_chain:
    product: CSARP_standard
    sar: |-
      motion-compensated f-k migration, sigma_x 2.5 m SLC, start_eps 3.15 (2016 param_csarp/param_sar, scout-verified)
    combine: |-
      delay-and-sum channels; rline_rng [-5..5] = 11 looks, dline 6 -> 14.85 m posting, ~25 m effective along-track resolution (M24 CReSIS-standard convention; 11/6 not directly read from the 2016 structs -- recorded assumption)
    window: ft_wind hanning (scout hand-verified)
