schema_version: 1
name: greenland_westcoast

# A REPEAT-PASS INSTRUMENT LINE, not an altitude line.
#
# Two flights cross the same west-coast transit at essentially the same
# height (419-492 m median AGL) over a near-constant ~1.25 km ice column.
# What differs is the radar: 195/30 MHz (2019 P-3) vs 200/100 MHz (2016
# P-3) on identical geometry -- the instrument-swap axis with REAL
# instruments on both sides of the swap.
#
# REMOVED 2026-08-19: the 2015 C-130 pass (20150425_02_039, 205/50 MHz).
# Its CSARP_standard product has the transmitted-waveform IMAGES (separate
# waveforms combined to extend dynamic range) incorrectly combined, so the
# surface and the bed sit on DIFFERENT radiometric scales within one trace.
# The symptoms were all visible in the first run: a brightness step at the
# ~10 us img_comb boundary, a measured bed-to-surface ratio of -115 dB
# (31 dB below the P-3 products over the same bed), and an 87 m rms
# thickness disagreement. A pass whose surface and bed are not on one scale
# cannot participate in a surface-referenced instrument comparison.
#
# Discovered 2026-08-18 by projecting every frame in a corridor around the
# 2019 track onto it and keeping the overlaps. Six flights cross this line in
# total, but only these three reach a common 49.8 km window: the 2011 pass
# ends at s 56.5 km, the 2017 pass does not start until s 41.3, and the 2015
# wideband pass runs s 30.7-80.4. Including all six would cap the window at
# 15.2 km, so the other three are deliberately not carried. Re-searching with
# a ~10 km corridor and 3 km lateral tolerance -- four times the original --
# found no further flights and no frames extending these: each crosses the
# corridor exactly once, so the limit is along-track coverage, not alignment.

identity:
  case_prefix: greenland_westcoast
  season: 2019_Greenland_P3
  crs: EPSG:3413
  fc_hz: 195000000.0
  grounding_line_s_km: null

reference:
  pass: p3_2019
  frames:
  - '20190514_01_045'
  - '20190514_01_046'

# No altitude ordering is possible -- every pass is within ~75 m of 460 m
# AGL -- so the order is chronological.
order:
- p3_2016
- p3_2019

passes:
  p3_2016:
    agl_med_m: 419.0
    season: 2016_Greenland_P3
    param_frame: '20160511_03_038'
    instrument: mcords_p3_2016_200mhz
    reversed: false
    segments:
      full:
      - frame: '20160511_03_038'
        slice:
        - 148
        - 3332
      - frame: '20160511_03_039'
        slice:
        - 0
        - 3332
  p3_2019:
    agl_med_m: 492.0
    season: 2019_Greenland_P3
    param_frame: '20190514_01_045'
    instrument: mcords_p3_2019
    reversed: false
    segments:
      full:
      - frame: '20190514_01_045'
        slice:
        - 0
        - 3333
      - frame: '20190514_01_046'
        slice:
        - 0
        - 3181

segments:
  # s 0 -> 97.35 km on the 2019 axis: the full two-pass overlap. Grew from
  # 49.8 km when the 2015 C-130 pass was removed (see below) -- that pass's
  # coverage was what pinned the window to s 17.1-66.9.
  full:
    s0_km: 0.0
    n_traces: 470
    decomp_s_km:
    - 42.0

figures:
  # ~1.25 km of ice, so the bed sits ~14.8 us below the surface.
  radargram:
    y_us: [-1.0, 20.0]
    db: [-110.0, 5.0]
    scale: per_panel      # three products with different dynamic ranges
  profile:
    rel_us: [-1.5, 20.5]
    x_us: [-1.0, 20.0]
    db: [-130.0, 5.0]

# No required-surface-SNR store is configured for these segments, and this
# line has no grounding line or Antarctic bed ensemble.
unsupported:
- gamma_rssnr
- demogorgn_bed
- hybrid

provenance:
  measured_caveats: >
    Measured references are CSARP_standard. TWO DIFFERENT PRODUCTS: the
    fast-time bin is 9.99 ns (2016) vs 16.67 ns (2019), so no depth or delay
    comparison may be made by bin index -- only in metres or microseconds on
    each pass's own lattice. Bandwidth differs 100 vs 30 MHz (~3x the range
    resolution), so a like-for-like clutter comparison has to account for
    that before it accounts for anything else.
    TRACK CAVEAT: p3_2016 flies ~109 m off the reference track (median over
    this window, max 295 m). Over rough bed that is not quite the same
    scene, and any disagreement it shows should be attributed to geometry
    before it is attributed to the instrument.
  real_chain:
    product: CSARP_standard
    sar: >
      Per-season CReSIS processing; NOT read from these seasons' param
      structs. Recorded as an assumption, not a measurement.
    combine: >
      Look/decimation convention ASSUMED to be the CReSIS standard. Three
      seasons across four years are unlikely to share one convention exactly.
    window: >
      Assumed hanning, following the other Greenland lines. Not verified per
      season on this line.
    caveat: >
      This line exists for INSTRUMENT comparison, so its processing
      provenance is the weakest part of it and the part most worth verifying
      before any quantitative cross-instrument claim.
