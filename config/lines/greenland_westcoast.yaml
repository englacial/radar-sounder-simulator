schema_version: 1
name: greenland_westcoast
# Instrument line: three P-3 flights over the same west-coast transit at
# ~0.5 km AGL. 2017 and 2019 fly the 195/30 MHz MCoRDS3 (a same-instrument
# repeat, the product-to-product noise floor); 2016 flies the 200/100 MHz
# 2-element MCoRDS5 (the instrument swap). Excluded: both 2015 C-130 passes
# (mis-combined waveform images put surface and bed on different radiometric
# scales) and 20110423_01_020-021 (enters the corridor only at s 22 km).

identity:
  case_prefix: greenland_westcoast
  crs: EPSG:3413
  fc_hz: 195000000.0
  grounding_line_s_km: null
  bed_dem: bedmachine

reference:
  pass: p3_2017
  frames: ['20170510_03_013', '20170510_03_014']

order: [p3_2016, p3_2017, p3_2019]

passes:
  p3_2016:
    agl_med_m: 484.0
    season: 2016_Greenland_P3
    param_frame: '20160511_03_034'
    instrument: mcords5_p3_2016
    reversed: false
    segments:
      pilot:
      - {frame: '20160511_03_034', slice: [2365, 3034]}
      full:
      - {frame: '20160511_03_033', slice: [3207, 3332]}
      - {frame: '20160511_03_034'}
      - {frame: '20160511_03_035', slice: [0, 3023]}
  p3_2017:
    agl_med_m: 500.0
    season: 2017_Greenland_P3
    param_frame: '20170510_03_013'
    instrument: mcords3_p3_2014
    reversed: false
    segments:
      pilot:
      - {frame: '20170510_03_013', slice: [2678, 3334]}
      - {frame: '20170510_03_014', slice: [0, 12]}
      full:
      - {frame: '20170510_03_013', slice: [186, 3334]}
      - {frame: '20170510_03_014'}
  p3_2019:
    agl_med_m: 476.0
    season: 2019_Greenland_P3
    param_frame: '20190514_01_039'
    instrument: mcords3_p3_2019
    reversed: false
    segments:
      pilot:
      - {frame: '20190514_01_039', slice: [2491, 3160]}
      full:
      - {frame: '20190514_01_039'}
      - {frame: '20190514_01_040', slice: [0, 3146]}

segments:
  pilot:                       # 10 km window, s 40-50 km on the 2017 axis
    s0_km: 40.0
    n_traces: 48
    decomp_s_km: [45.0]
  full:                        # s 2.8-99.7 km, the three-way overlap
    s0_km: 2.8
    n_traces: 470
    decomp_s_km: [50.0]

figures:
  radargram: {y_us: [-1.0, 18.0], db: [-110.0, 5.0], scale: shared, source_color: false}
  profile: {rel_us: [-1.5, 18.5], x_us: [-1.0, 18.0], db: [-130.0, 5.0]}

rssnr:
  snapshot: GEAMAHQ7BRVPG9SQPK20
  store: {bucket: opr-radar-metrics, prefix: icechunk/greenland, region: us-west-2}

provenance:
  measured_caveats: >
    CSARP_standard. Three products, two systems: fast-time bin 9.99 ns (2016),
    33.33 ns (2017), 16.67 ns (2019), so compare in metres/microseconds only.
    Bandwidth 100 vs 30 MHz across the swap. Track offsets vs reference:
    p3_2016 ~47 m median (max 264 m), p3_2019 ~13 m (max 99 m).
  real_chain:
    product: CSARP_standard
    sar: per-season CReSIS processing (assumed, not read from the param structs)
    combine: CReSIS-standard look/decimation convention (assumed)
    window: hanning (assumed)

calibration:
  gamma_surface_db:
    value: -10.0
    why: >
      Physical air-ice value (~1 dB above smooth Fresnel -11.03). The in-run
      solve gave -3.73 dB, absorbing model anomalies; kept as a diagnostic
      (claude_notes/gamma_solve_design_2026-08-20.md).
  att_db_per_km: solve
