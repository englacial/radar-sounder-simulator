schema_version: 1
name: antarctica_david
# Frequency-diversity line: the same ~121 km David Glacier / Drygalski Ice
# Tongue transit flown at ~0.5 km AGL by the 195/30 MHz MCoRDS5 Basler (2017)
# and the 60/15 MHz MARFA Basler (2022 and 2023, a same-instrument repeat).
# Crosses the grounding line at s 95.4 km (hydrostatic flotation on the
# reference picks + EIGEN-6C4 geoid).

identity:
  case_prefix: antarctica_david
  crs: EPSG:3031
  fc_hz: 60000000.0
  grounding_line_s_km: 95.4
  bed_dem: demogorgn

reference:
  pass: baslermkb_2023
  frames: ['20231212_02_015', '20231212_02_016', '20231212_02_017']

order: [basler_2017, baslermkb_2022, baslermkb_2023]

passes:
  basler_2017:
    agl_med_m: 446.0
    season: 2017_Antarctica_Basler
    param_frame: '20171217_01_022'
    instrument: mcords5_basler_2017
    reversed: false
    segments:
      pilot:
      - {frame: '20171217_01_023', slice: [526, 1201]}
      full:
      - {frame: '20171217_01_022', slice: [1770, 3334]}
      - {frame: '20171217_01_023'}
      - {frame: '20171217_01_024'}
  baslermkb_2022:
    agl_med_m: 544.0
    season: 2022_Antarctica_BaslerMKB
    param_frame: '20221212_01_016'
    instrument: marfa_baslermkb_2022
    reversed: false
    segments:
      pilot:
      - {frame: '20221212_01_016', slice: [1776, 1819]}
      - {frame: '20221212_01_017', slice: [0, 325]}
      full:
      - {frame: '20221212_01_016', slice: [670, 1819]}
      - {frame: '20221212_01_017'}
      - {frame: '20221212_01_018', slice: [0, 1489]}
  baslermkb_2023:
    agl_med_m: 604.0
    season: 2023_Antarctica_BaslerMKB
    param_frame: '20231212_02_015'
    instrument: marfa_baslermkb_2022
    reversed: false
    segments:
      pilot:
      - {frame: '20231212_02_016', slice: [21, 389]}
      full:
      - {frame: '20231212_02_015', slice: [734, 1818]}
      - {frame: '20231212_02_016'}
      - {frame: '20231212_02_017', slice: [0, 1551]}

segments:
  pilot:                       # 10 km grounded window, s 50-60 km
    s0_km: 50.0
    n_traces: 48
    decomp_s_km: [55.0]
  full:                        # s 20-141 km on the 2023 axis, grounded + floating
    s0_km: 20.0
    n_traces: 585
    crosses_gl: true
    decomp_s_km: [55.0, 120.0]

figures:
  radargram: {y_us: [-1.0, 30.0], db: [-110.0, 5.0], scale: shared, source_color: false}
  profile: {rel_us: [-1.5, 30.5], x_us: [-1.0, 30.0], db: [-130.0, 5.0]}

rssnr:
  snapshot: 3YH47013745B2T5ZZR50
  store: {bucket: opr-radar-metrics, prefix: icechunk/antarctica, region: us-west-2}

provenance:
  measured_caveats: >
    CSARP_standard. Three products, two systems: 60/15 MHz passes on a 20 ns
    lattice, the 195/30 MHz pass on 33.33 ns; carrier ratio 3.25x. Track
    offsets vs reference: baslermkb_2022 129 m median (p95 ~890 m),
    basler_2017 106 m median. Floating-stretch picks are the ice-ocean
    interface. DEMOGORGN is not known to be conditioned on these flights.
  real_chain:
    product: CSARP_standard
    sar: per-season CReSIS processing (assumed, not read from the param structs)
    combine: CReSIS-standard look/decimation convention (assumed)
    window: hanning (assumed)

calibration:
  gamma_surface_db:
    value: -10.0
    why: >
      Physical air-ice value (~1 dB above smooth Fresnel -11.03). The in-run
      solve gave +7.41 dB, absorbing model anomalies; kept as a diagnostic
      (claude_notes/gamma_solve_design_2026-08-20.md).
  att_db_per_km: solve
