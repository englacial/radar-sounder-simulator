schema_version: 1
name: mcords3_p3_greenland
description: MCoRDS 3 on the NASA P-3, 2014 and 2017 Greenland campaigns.

# REAL system, read per pass from its own OPR frame. Verified 2026-08-18:
# 20140421_01_069 (2014) and 20170424_01_067 (2017) report identical values
# -- 195 MHz, 30 MHz, 10 us, hanning -- which is what makes this pair the
# best instrument parity of any multi-altitude repeat found.
source: {kind: opr_frame}
segments:            # YYYYMMDD_SS; one segment is one instrument
  - '20140421_01'
  - '20170424_01'
  - '20170510_03'    # west-coast transit, same 2017 campaign and params

simulated:
  frequency_Hz:   null      # -> 195 MHz
  bandwidth_Hz:   null      # -> 30 MHz
  pulse_length_s: null      # -> 10 us
  window:         null      # -> hanning
  antenna:
    kind: array
    n_elements: 7
    spacing_lam: 0.5
    roll_source: nav

provenance: >
  The two passes share fc/B/waveforms/PRF/SAR params exactly, but the product
  fast-time bin differs 0.16% (33.3859 vs 33.3333 ns) and t0 by 167 ns -- a
  PRODUCT property, not an instrument one, so it is carried by each pass's own
  lattice rather than here. ft_wind decode falls back on both passes; the
  scout hand-verified the true value IS hanning.

recorded:
  gain_tx_dBi: 10.8
  gain_rx_dBi: 14.5
  tx_power_W: 1011
  system_loss_dB: 6.4
  noise_figure_dB: 3.0
