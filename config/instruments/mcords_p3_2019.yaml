schema_version: 1
name: mcords_p3_2019
description: 195/30 MHz on the NASA P-3, 2019.

# REAL system: every simulated parameter is read from the OPR frame the pass
# was actually flown on.
source: {kind: opr_frame}
segments:            # YYYYMMDD_SS; one segment is one instrument
  - '20190514_01'

simulated:
  frequency_Hz:   null
  bandwidth_Hz:   null
  pulse_length_s: null
  window:         null
  antenna:
    kind: array
    n_elements: 7
    spacing_lam: 0.5
    roll_source: nav

provenance: >
  Same carrier and bandwidth as the 2014/2017 P-3 systems; recorded separately because the product fast-time bin differs (16.67 ns here vs 33.33 ns) and five years separate them.
  ANTENNA CAVEAT: n_elements = 7 is the 2017 P-3 centre-array readme value,
  applied here unverified. It is the least-supported number in this file.
