schema_version: 1
name: mcords_c130_2015_205mhz
description: 205/50 MHz on the NASA C-130.

# REAL system: every simulated parameter is read from the OPR frame the pass
# was actually flown on.
source: {kind: opr_frame}
segments:            # YYYYMMDD_SS; one segment is one instrument
  - '20150425_02'

simulated:
  frequency_Hz:   null
  bandwidth_Hz:   null
  pulse_length_s: null
  window:         null
  antenna:
    kind: array
    n_elements: 7
    spacing_lam: 0.5
    roll_source: nav

provenance: >
  Different platform and a different band from the P-3 systems on the same line.
  ANTENNA CAVEAT: n_elements = 7 is the 2017 P-3 centre-array readme value,
  applied here unverified. It is the least-supported number in this file.
