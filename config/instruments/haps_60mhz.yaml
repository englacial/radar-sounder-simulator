schema_version: 1
name: haps_60mhz
description: >
  Stratospheric-platform sounder, 60 MHz / 15 MHz. Mirrors the 'haps' preset
  of the mission design tool. SYNTHETIC: no OPR frame is consulted.

source: {kind: stated}

simulated:
  frequency_Hz:   60.0e6
  bandwidth_Hz:   15.0e6
  pulse_length_s: 20.0e-6
  window: hann
  antenna:
    kind: array
    n_elements: 8
    spacing_lam: 0.5
    roll_source: none     # a synthetic smooth trajectory has no roll

provenance: >
  Design point, not a built system. Pair it with a synthetic observation
  altitude (14 km is the design tool's assumption) rather than assuming one:
  altitude belongs to the observation here, so the same box can be flown at
  several heights over the same line.

recorded:
  altitude_m_design: 14000
  velocity_ms: 20
  payload_power_W: 200
  pa_efficiency: 0.5
  tx_power_W: 100
  gain_tx_dBi: 8
  gain_rx_dBi: 8
