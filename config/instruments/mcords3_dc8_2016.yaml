schema_version: 1
name: mcords3_dc8_2016
description: MCoRDS on the NASA DC-8, 2016 Antarctic campaign.

# REAL system: every simulated parameter is read from the OPR frame each pass
# was actually flown on. Verified 2026-08-18: all three param frames of the
# altitude triplet (20161105_05_005 / 20161028_05_006 / 20161031_07_005)
# report the same values -- 190 MHz, 50 MHz, 10 us bed waveform, hanning --
# so the triplet really is one instrument at three altitudes, which is what
# makes the altitude comparison a clean single-variable experiment.
source: {kind: opr_frame}
segments:            # YYYYMMDD_SS; one segment is one instrument
  - '20161105_05'
  - '20161028_05'
  - '20161031_07'

simulated:
  frequency_Hz:   null      # -> 190 MHz from the frame
  bandwidth_Hz:   null      # -> 50 MHz
  pulse_length_s: null      # -> 10 us (the bed waveform)
  window:         null      # -> hanning
  antenna:
    kind: array
    n_elements: 7
    spacing_lam: 0.5
    roll_source: nav

provenance: >
  ft_wind decode falls back on all three 2016 param frames; the scout
  hand-verified the true value IS hanning (param_csarp.csarp), so the
  modelled 'hann' is correct -- a provenance gap, not a measurement gap.
  CAVEAT: n_elements = 7 is the 2017 P-3 centre-array readme value applied
  unchanged to a DC-8 flight. That transfer is unverified.

recorded:
  gain_tx_dBi: 10.8
  gain_rx_dBi: 14.5
  system_loss_dB: 6.4
  noise_figure_dB: 3.0
