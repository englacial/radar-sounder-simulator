stratum_lines:
  antarctica_david:
    default: aa_grounded_500_1500
    note: no ATM on the line; grounded ~900 m -> AA grounded 500-1500 stratum (marginal); Getz-transfer
      entry kept in atm_b1.yaml
  antarctica_getz:
    default: aa_grounded_lt500_m
    note: line spans grounded coastal ice into the shelf; grounded <500 m stratum (marginal); the shelf
      stratum is refused
  greenland_westcoast:
    default: gl_percolation_belt_1500_2500
    note: site-specific westcoast_*_exp entries in atm_b1.yaml take precedence; stratum fallback for passes
      without one
  greenland_geikie01_transit:
    default: gl_interior_gt2500
    note: site-specific geikie_2014 (5.15 cm / 5.28 m) takes precedence; stratum median 5.0 cm / 7.3 m
  antarctica_pineisland_south:
    default: aa_grounded_500_1500_mean
    note: 'PROVISIONAL, no line-specific ATM fit yet. Grounded surface elevation 449 m median
      (p10-p90 207-606 m), so the line straddles the <500 / 500-1500 band edge. The 500-1500
      stratum is chosen over grounded_lt500_m on a MEASUREMENT, not the elevation rule: Tier 1
      ILATM2 RMS along the grounded part of this line is 8.3 cm p50 / 63 cm p90, against the
      500-1500 stratum sigma_bl30 of 7.6 cm and the <500 stratum sigma of 24.9 cm -- the coastal
      <500 stratum is dominated by crevassed margin sites and over-predicts here by ~3x. Stratum
      usability is marginal (Matern nu 0.38, power law fits better, exponential under-predicts
      wide-angle scatter by ~0.9 dB at 1.5 m). Replace with a line fit:
      claude_notes/atm_roughness/atm_pull.py + atm_roughness.py --line antarctica_pineisland_south
      (ATM_DAYS entries added 2026-08-28).'
  antarctica_pineisland_north:
    default: aa_grounded_500_1500_mean
    note: 'PROVISIONAL, no line-specific ATM fit yet. Same stratum and same reasoning as
      antarctica_pineisland_south (grounded surface 342 m median, p10-p90 115-588 m), but the
      over-estimate is larger here: Tier 1 ILATM2 RMS on the grounded part is 4.8 cm p50 /
      6.4 cm p90, i.e. the stratum sigma_bl30 (7.6 cm) is ~1.6x the measured value. This line is
      the strongest candidate for a line-specific fit -- its grounded surface is the smoothest and
      most uniform of the scouted set and its nearest Tier 2 site is exponential-adequate.'
