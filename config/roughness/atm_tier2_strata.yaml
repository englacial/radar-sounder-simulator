schema_version: 1
description: 'Per-stratum exponential-ACF surface roughness (sigma, l) from the OIB ATM L1B Tier 2 analysis
  (claude_notes/atm_regional/tier2_results_2026-08-27.md; outputs/atm_regional/tier2/recommendation_by_stratum.csv,
  726 sites / 2111 site-years, fit band 1-30 m lag, site medians). Same spectra schema as atm_b1.yaml;
  merged into its table by tools/surface_roughness_b1.py. usability: use = exponential is the best 3-parameter
  family (Matern nu ~0.35-0.55), l rarely at the bound, sigma <= 10 cm; marginal = power law fits better
  but the in-band difference is -1..-2 dB (exponential UNDER-predicts wide-angle scatter by that much
  at 195/300 MHz) or l bound hit in <= 30 % of years; refuse = nu >= 0.59, l at bound in >= 40 % of years,
  or sigma >> 10 cm (facet tilt, not sub-facet roughness) -- the exponential OVER-predicts by +2..+4 dB
  median, +10..+25 dB p90-p95; a Matern/power-law law is needed. sigma is the exponential-fit sigma (pair-consistent
  with l); sigma_bl30 is the non-parametric RMS below 30 m for reference (ratio ~1.15). Strata are elevation
  bands within facies proxies (elevation/latitude rule; RACMO melt where available). 1.0/0.75 m Bragg
  points are sub-band extrapolations. East Antarctic plateau unsampled.'
