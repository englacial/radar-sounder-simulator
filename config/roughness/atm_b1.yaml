schema_version: 1
description: 'Path B1 effective-Gaussian surface roughness: measured 2-D surface PSDs per line (OIB ATM
  L1B, claude_notes/atm_roughness), matched by tools/surface_roughness_b1.py at the Bragg wavenumber of
  the clutter angle. PSD convention: int S d2k = sigma^2; Gaussian S = sigma^2 l^2/(4 pi) exp(-k^2 l^2/4);
  power law S = A k^-beta; exponential S = sigma^2 l^2/(2 pi)(1+k^2 l^2)^-1.5. Exponential entries
  are also usable directly by the kernel (source atm_exponential -> RoughnessConfig acf: exponential).'
theta_c_deg: 30.0
rule: tangent
spectra:
  westcoast_2016:
    family: powerlaw
    A_m4: 2.9364e-05
    beta: 3.2949
    provenance: ILATM1B 2016-05-11, line-median per-block best-family S(k_B) at 5/1.5/1.0/0.75 m, power
      law through the medians; pooled fit H=0.61
  westcoast_2017:
    family: powerlaw
    A_m4: 3.3374e-05
    beta: 2.5333
    provenance: ILATM1B 2017-05-10, line-median per-block best-family S(k_B) at 5/1.5/1.0/0.75 m, power
      law through the medians; pooled fit H=0.37
  westcoast_2019:
    family: powerlaw
    A_m4: 4.8174e-05
    beta: 3.0235
    provenance: ILATM1B 2019-05-14, line-median per-block best-family S(k_B) at 5/1.5/1.0/0.75 m, power
      law through the medians; pooled fit H=0.44
  geikie_2014:
    family: exponential
    sigma_m: 0.0515
    l_m: 5.276
    provenance: ILATM1B 2014-04-21, exponential ACF best in 83 % of 1 km blocks (white residuals 79 %);
      block-median sigma, l
  getz_2016:
    family: powerlaw
    A_m4: 3.4148e-05
    beta: 2.9928
    provenance: ILATM1B 2016-11-05 (low pass), LINE-median per-block S(k_B); pooled fit is 3-5 dB higher
      (H=0.37); 3 regimes along s, see note
  getz_2016_pilot_window:
    family: powerlaw
    provenance: blocks s 30-40 km only (10 blocks; straddles the 32 km regime boundary) -- sensitivity,
      not used by default
    A_m4: 0.00030041
    beta: 2.6688
  westcoast_2016_exp:
    family: exponential
    sigma_m: 0.0478
    l_m: 10.0
    provenance: 'NOT the best family (power law, beta 3.29): least-squares exponential PSD through the
      same line-median per-block S(k_B) at 5/1.5/1.0/0.75 m the power law is fit through, l bounded to
      <= 10 m (the beta ~ 3 tail is the l -> inf limit of the exponential PSD); residual -0.5..+0.3 dB.
      Direct block-median exponential fit (l < 500 m, 45 blocks) 7.1 cm / 28 m for reference. For the
      acf: exponential comparison on a self-affine surface (claude_notes/roughness_exponential_2026-08-27.md)'
  westcoast_2017_exp:
    family: exponential
    sigma_m: 0.0333
    l_m: 1.038
    provenance: 'NOT the best family (power law, beta 2.53): least-squares exponential PSD through the
      line-median per-block S(k_B) at 5/1.5/1.0/0.75 m; residual -0.4..+0.4 dB. Direct block-median
      exponential fit (l < 500 m, 80 blocks) 10.7 cm / 10.3 m (+3/+1/0/0 dB at the four points)'
  westcoast_2019_exp:
    family: exponential
    sigma_m: 0.0377
    l_m: 2.59
    provenance: 'NOT the best family (power law, beta 3.02): least-squares exponential PSD through the
      line-median per-block S(k_B) at 5/1.5/1.0/0.75 m; residual < 0.1 dB. Direct block-median exponential
      fit (l < 500 m, 95 blocks) 10.1 cm / 21.8 m'
  westcoast_2017_expmean:
    family: exponential
    sigma_m: 0.0428
    l_m: 1.32
    provenance: 'ADOPTED 2026-09-01 (area-mean aggregation): LSQ exponential PSD through the
      linear-domain MEAN of per-block best-family S(k_B) at 5/1.5/1.0/0.75 m (102 blocks, ILATM1B
      2017-05-10). Replaces westcoast_2017_exp (block-MEDIAN fit, kept for reference);
      mean-vs-median +0.7..+1.3 dB. Method + validation:
      claude_notes/experiments_2026-08-31/atm_area_mean/{reaggregate.py,results.md}'
  geikie_2014_expmean:
    family: exponential
    sigma_m: 0.0325
    l_m: 1.48
    provenance: 'ADOPTED 2026-09-01 (area-mean aggregation): mean of per-block S(k_B), 76 blocks
      ILATM1B 2014-04-21; +0.5..+2.4 dB vs block medians. Replaces geikie_2014 for source
      atm_exponential (that entry is a median of per-block (sigma, l) FITS -- a different
      aggregation again; the mean fit sits ~+1.4 dB above it at the Bragg points).'
  getz_2016_expmean:
    family: exponential
    sigma_m: 0.0456
    l_m: 1.21
    provenance: 'ADOPTED 2026-09-01 (area-mean aggregation): mean of per-block S(k_B), 176 blocks
      ILATM1B 2016-11-05 -- the line''s OWN ATM, replacing the aa_grounded_lt500_m stratum fallback
      (that stratum''s heavy tail comes from other coastal sites). -4.0..-1.8 dB vs the stratum entry
      at the four Bragg points (dimmer near nadir: fixes half the high-pass over-prediction; the
      2026-08 HAPS design numbers used the stratum entry and shift materially).'
  david_2013_expmean:
    family: exponential
    sigma_m: 0.1358
    l_m: 1.887
    provenance: 'ADOPTED 2026-09-01 (area-mean aggregation): mean of per-block S(k_B), 144 blocks
      pooled ILATM1B 2013-11-19/20 -- line-specific ATM exists (the stratum_lines "no ATM on the line"
      note predates the per-line ATM runs), replacing the aa_grounded_500_1500 stratum fallback.
      +9.5..+10.5 dB vs the stratum entry; closed the david mid-column deficit (-12 dB typ -> -2).'
lines:
  greenland_westcoast:
    # ONE surface law per line: the reference pass's (p3_2017) ATM spectrum is
    # used for every pass, real or synthetic (user decision 2026-08-28). The
    # 2016/2019 spectra stay in `spectra:` for reference only.
    default: westcoast_2017
    exponential:    # alternate mapping for source atm_exponential (acf: exponential)
      # branch atm-area-mean: area-mean entry (was westcoast_2017_exp, block-median fit)
      default: westcoast_2017_expmean
  greenland_geikie01_transit:
    default: geikie_2014
    exponential:    # branch atm-area-mean (was the geikie_2014 block-median-fit entry)
      default: geikie_2014_expmean
  antarctica_getz:
    default: getz_2016
    exponential:    # branch atm-area-mean (was the aa_grounded_lt500_m stratum fallback)
      default: getz_2016_expmean
  antarctica_david:
    default: getz_2016
    note: no ATM on the line; Getz transferred (same season/ice type argument, plan caveat)
    exponential:    # branch atm-area-mean (was the aa_grounded_500_1500 stratum fallback)
      default: david_2013_expmean
