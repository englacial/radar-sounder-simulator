[project]
name = "soundersim"
version = "0.1.0"
description = "Coherent/incoherent radar sounder simulator for Earth's ice sheets"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "jax",
    "rasterio",
    "pyproj",
    "pydantic>=2",
    "xarray",
    "h5netcdf",
    "matplotlib",
    "affine",
    "xopr",
    "pystac-client",
    "earthaccess>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest",
    "scipy",
    "simc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundersim"]

[tool.pytest.ini_options]
addopts = "-m \"not integration\""
markers = [
    "integration: slow tests (deselected by default; select with -m integration)",
]

[tool.uv.sources]
simc = { git = "https://github.com/lpl-tapir/simc", rev = "bac8b97a66bc8bc327ff48a793031a6d1fcd6915" }
