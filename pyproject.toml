[project]
name = "soundersim"
version = "0.1.0"
description = "Coherent/incoherent radar sounder simulator for Earth's ice sheets"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "jax",
    "rasterio",
    "pyproj",
    "pydantic>=2",
    "xarray",
    "h5netcdf",
    "matplotlib",
    "affine",
    "xopr",
    "pystac-client",
    "earthaccess>=0.17.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "icechunk>=1.1.21",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = [
    "mpmath>=1.4.1",
    "pytest",
    "simc",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundersim"]

[tool.pytest.ini_options]
addopts = "-m \"not integration\""
markers = [
    "integration: slow tests (deselected by default; select with -m integration)",
]

[tool.uv.sources]
simc = { git = "https://github.com/lpl-tapir/simc", rev = "bac8b97a66bc8bc327ff48a793031a6d1fcd6915" }

[tool.ruff]
line-length = 88
# session artifacts (CLAUDE.md), not maintained code
exclude = ["claude_notes"]

[tool.ruff.lint]
# E402: module-level imports after `matplotlib.use("Agg")` and the
#       sys.path bootstrap in tools/ -- deliberate and load-bearing.
# E741: `l` is correlation length throughout the roughness/Gerekos work;
#       renaming it would make the code harder to read against the paper.
# E731: short lambdas assigned for _retry(...) call sites.
ignore = ["E402", "E741", "E731"]
