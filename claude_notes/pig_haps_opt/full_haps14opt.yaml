schema_version: 1
meta:
  name: full_haps14opt
  description: >
    ONE-OFF (not committed to config/experiments/, which ships exactly full and
    pilot and requires them identical apart from segment). The shipped `full`
    protocol on the two Pine Island lines ONLY, with two extra 14 km design
    points added: haps14_pig_075 (75/30 MHz) and haps14_pig_050 (50/20 MHz),
    the finalists of the 2026-08-28 Bed SCR sweep (claude_notes/pig_haps_opt/).
    Everything else -- bed, reflectivity, physics, processing -- is byte-identical
    to config/experiments/full.yaml, so the real passes and the 60 MHz haps_14km /
    haps_20km baselines stay directly comparable with the shipped runs.
    Run: tools/run_basal_clutter.py --config claude_notes/pig_haps_opt/full_haps14opt.yaml --line <line>

run:
  lines: [antarctica_pineisland_north, antarctica_pineisland_south]
  segment: full

  extra_passes:
    haps_14km: {carrier: reference, altitude_m: 14000.0, instrument: haps_60mhz}
    haps_20km: {carrier: reference, altitude_m: 20000.0, instrument: haps_60mhz}
    haps14_pig_075: {carrier: reference, altitude_m: 14000.0, instrument: haps14_pig_075,
                     why: 'sweep winner: 75/30 MHz, 8 el at 0.3569 lam = 9.99 m'}
    haps14_pig_050: {carrier: reference, altitude_m: 14000.0, instrument: haps14_pig_050,
                     why: 'sweep runner-up, best on south: 50/20 MHz, 8 el at 0.2378 lam = 9.98 m'}

  bed:                         # DEM comes from the line (identity.bed_dem)
    nadir: picked
    floating: picked
    demogorgn_seed: 0

  reflectivity:
    gamma_from_rssnr: true
    specular_diffuse: {specular_fraction: 0.5, tilt_s0_deg: 3.0}

  physics:
    att_db_per_km: solve       # -> the line's calibration block
    surface_roughness: {source: atm_exponential}
    bed_roughness: {sigma_m: 0.10, corr_length_m: 0.886}

  processing:
    chain: standard
    proc_cache: true
    companion: false
